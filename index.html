<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/variables/_variables.css">
    <link rel="stylesheet" href="./assets/fonts/_montserrat.css">
    <link rel="stylesheet" href="./assets/fonts/_rubikdoodleshadow.css">
    <link rel="stylesheet" href="./styles/header/_menu.css">
    <link rel="stylesheet" href="./styles/main/_main.css">
    <link rel="stylesheet" href="./styles/dialog/_dialog.css">
    <link rel="stylesheet" href="./styles/styles.css">

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon/favicon.png">
    <title>Express Bestellung</title>
</head>

<body onload="init()" class="whiteTheme">
    <header class="menu">
        <div class="menu__logo">
            <img src="./assets/icons/logo/logo.png" alt="Logo">
        </div>
        <h1 class="menu__header">Express Delivery</h1>
        <div tabindex="1" class="menu__toggle" onclick="toggleBg()">
            <div class="menu__toggle_circle"></div>
        </div>
    </header>

    <main class="whiteTheme">
        <section class="main__img">
            <img src="./assets/img/meals/russian/piroggen.jpg" alt="Bild von Piroggen">
        </section>
        <section class="content">
            <section class="content__menu">
                <h2>Speisen</h2>
                <nav class="content__menu_categories whiteTheme">
                    <button class="whiteTheme" onclick="filterMeals('Griechische Gerichte')">Griechische Gerichte</button>
                    <button class="whiteTheme" onclick="filterMeals('Italienische Gerichte')">Italienische Gerichte</button>
                    <button class="whiteTheme" onclick="filterMeals('Russische Gerichte')">Russische Gerichte</button>
                    <button class="whiteTheme" onclick="loadAllMeals()">Alle Gerichte</button>
                    <button tabindex="1" id="openCartBtn" onclick="openCart()">
                        <img src="./assets/icons/arrows/left.svg" alt="Pfeil für Menü öffnen">
                    </button>
                    <button tabindex="1" id="closeCartBtn" onclick="closeCart()" class="not-shown">
                        <img src="./assets/icons/arrows/right.svg" alt="Pfeil für Menü schließen">
                    </button>
                </nav>
            </section>
            <section class="content__group">
                <section class="meals" id="mealsField">

                </section>
                <section id="cartSection" class="cart">
                    <h2 class="cart__header">Warenkorb</h2>
                    <section class="cart__positions" id="cartField">

                    </section>
                    <table class="cart__costs">
                        <tr class="cart__costs_delivery">
                            <th>Lieferkosten:</th>
                            <td>5.00 EURO</td>
                        </tr>
                        <tr class="cart__costs_tax">
                            <th>Davon Mwst.:</th>
                            <td id="tax">0.95 EURO</td>
                        </tr>
                        <tr class="cart__costs_sum">
                            <th>Gesamtsumme:</th>
                            <td id="sum">5.00 EURO</td>
                        </tr>
                    </table>
                    <button id="orderBtn" class="btn-blocked whiteTheme" onclick="openDialog()" disabled>Jetzt bestellen!</button>
                </section>
            </section>
        </section>
    </main>

    <dialog id="dialog" class="whiteTheme">

    </dialog>

    <script src="js/script.js"></script>
    <script src="js/mealsDatabase.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/functional.js"></script>
    <script src="js/dialog.js"></script>
    
</body>

</html>
