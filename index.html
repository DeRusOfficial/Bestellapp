<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/variables/_variables.css">
    <link rel="stylesheet" href="./assets/fonts/_montserrat.css">
    <link rel="stylesheet" href="./assets/fonts/_rubikdoodleshadow.css">
    <link rel="stylesheet" href="./styles/header/_menu.css">
    <link rel="stylesheet" href="./styles/main/_main.css">
    <link rel="stylesheet" href="./styles/dialog/_dialog.css">
    <link rel="stylesheet" href="./styles/styles.css">

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon/favicon.png">
    <title>Express Bestellung</title>
</head>

<body onload="init()">
    <header class="menu">
        <div class="menu__logo">
            <img src="./assets/icons/logo/logo.png" alt="Logo">
        </div>
        <h1 class="menu__header">Express Delivery</h1>
        <div class="menu__toggle" onclick="toggleBg()">
            <div class="menu__toggle_circle"></div>
        </div>
    </header>

    <main>
        <section class="main__img">
            <img src="./assets/img/meals/russian/piroggen.jpg" alt="Bild von Piroggen">
        </section>
        <section class="content">
            <section class="content__menu">
                <h2>Speisen</h2>
                <nav class="content__menu_categories">
                    <button onclick="filterMeals('Griechische Gerichte')">Griechische Gerichte</button>
                    <button onclick="filterMeals('Italienische Gerichte')">Italienische Gerichte</button>
                    <button onclick="filterMeals('Russische Gerichte')">Russische Gerichte</button>
                    <button onclick="loadAllMeals()">Alle Gerichte</button>
                </nav>
            </section>
            <section class="content__group">
                <section class="meals" id="mealsField">

                </section>

                <section class="cart">
                    <h3 class="cart__header">Warenkorb</h3>
                    <div class="cart__positions" id="cartField">

                    </div>
                    <table class="cart__costs">
                        <tr class="cart__costs_delivery">
                            <th>Lieferkosten:</th>
                            <td>5.00 EURO</td>
                        </tr>
                        <tr class="cart__costs_tax">
                            <th>Davon Mwst.:</th>
                            <td id="tax">0.95 EURO</td>
                        </tr>
                        <tr class="cart__costs_sum">
                            <th>Gesamtsumme:</th>
                            <td id="sum">5.00 EURO</td>
                        </tr>
                    </table>
                    <button id="dialogBtn" class="btn-blocked" onclick="openDialog()" disabled>Jetzt bestellen!</button>
                </section>
            </section>
        </section>
    </main>

    <dialog id="dialog">
        <section class="modal">
            <div class="modal__header">Ihre Bestellung</div>
            <table class="modal__table">
                <thead id="tableHead">
                    <tr>
                        <th scope="col">Gericht und Preis</th>
                        <th scope="col">Menge</th>
                    </tr>
                </thead>

                <tbody id="tableBody">

                </tbody>
            </table>
            <div id="cartSum"></div>
            <div class="modal__buttons">
                <button id="orderBtn" class="modal__content_btn-order" onclick="makeOrder()">Endgültig bestellen</button>
                <button class="modal__content_btn-close" onclick="closeDialog()">Schließen</button>
            </div>
        </section>
    </dialog>

    <script src="js/mealsDatabase.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/functional.js"></script>
    <script src="js/dialog.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
